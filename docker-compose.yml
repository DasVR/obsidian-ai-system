services:
  couchdb:
    image: couchdb:3.4
    container_name: obsidian-couchdb
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5984:5984"
    volumes:
      - ./couchdb-data:/opt/couchdb/data
      - ./couchdb-config:/opt/couchdb/etc/local.d
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: obsidian-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: obsidian-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant-data:/qdrant/storage
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  search-api:
    build: ./search-api
    container_name: obsidian-search-api
    restart: unless-stopped
    ports:
      - "8093:8090"
    volumes:
      - ./vault:/vault:ro
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://obsidian-qdrant:6333
      - OLLAMA_URL=http://obsidian-ollama:11434
      - VAULT_PATH=/vault
      - MODEL=phi4
      - EMBED_MODEL=nomic-embed-text
      - COUCHDB_URL=http://obsidian-couchdb:5984
      - COUCHDB_DB=obsidian-livesync
    networks:
      - proxy
    depends_on:
      - qdrant
      - ollama

  enhancer:
    build: ./enhancer
    container_name: obsidian-enhancer
    restart: "no"
    volumes:
      - ./vault:/vault
    environment:
      - OLLAMA_URL=http://obsidian-ollama:11434
      - VAULT_PATH=/vault
      - MODEL=phi4
      - INTERVAL_MIN=60
    networks:
      - proxy
    depends_on:
      - ollama

networks:
  proxy:
    external: true
